name: ci

on:
  push:
    branches: [develop, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2

      # Build the embedded web UI first so `go test` (which embeds
      # web/dist) exercises the real assets, and web type errors
      # fail CI here rather than at release time.
      - name: Build web UI
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      # Cheap guard against a broken Taskfile.yml (e.g. an unquoted cmd
      # string that YAML parses as a mapping, or a release task that
      # doesn't actually template its args) reaching a tag push, where
      # release.yml would fail on windows-latest with nothing published.
      - name: Install go-task
        run: |
          mkdir -p "$RUNNER_TEMP/task-bin"
          curl -sSL https://github.com/go-task/task/releases/latest/download/task_linux_amd64.tar.gz -o "$RUNNER_TEMP/task.tar.gz"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: Validate Taskfile
        run: |
          task --list-all
          task --dry desktop:release VERSION=0.0.0 UPDATE_BASE_URL=https://example.invalid/update

      # Mirrors Taskfile.yml's `lint` task.
      - name: Lint
        run: |
          go vet ./...
          test -z "$(gofmt -l $(git ls-files '*.go'))"

      # -race decided in M18: local run reported no data races (the
      # only failures were credential-dependent agent tests that skip
      # on runners without the claude CLI).
      - name: Test
        run: go test -race ./...

      # Guards a develop -> master promotion PR against regressing
      # release-please's metadata (see scripts/check-release-metadata.sh
      # for the smind incident this prevents). No-op on every other
      # PR/push.
      - name: Guard release metadata (develop -> master PRs only)
        if: github.event_name == 'pull_request' && github.base_ref == 'master'
        run: ./scripts/check-release-metadata.sh
