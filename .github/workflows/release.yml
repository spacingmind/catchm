name: release

# M23: build + publish the NSIS installer and its SHA-256 checksum on
# v* tag push. M24: also publish to catchm-api's RELEASES R2 bucket
# — that's what internal/update actually reads at runtime; the GitHub
# release (below) is kept only as an internal record. Tagging itself
# is a separate manual step (the spec's open question about
# develop-merge tagging stays with the user).
#
# macOS release (the plan's "CI" section): the build is split into a
# windows and a macos job (macos-15 = arm64), each uploading its
# artifacts; a publish job (needs both) does everything public — so if
# either platform fails to build, NOTHING is published and a release
# stays all-or-nothing across platforms.
#
# workflow_dispatch lets anyone exercise the whole build (installers +
# checksums + dmg) on demand, without cutting a tag or touching
# anything public. `dry_run` defaults to true; every publish step
# (GitHub release, latest.json manifest, R2 upload) carries an
# explicit `if:` so a dry run can never reach them — only a tag push,
# or an explicit `dry_run=false` dispatch, does. `version` has no safe
# "obviously fake" default: NSIS's VIProductVersion (see
# Taskfile.yml's desktop:release precondition) rejects anything but
# plain x.y.z, so the default is a real-looking low version rather
# than e.g. "0.0.0-dry".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build + checksum only; skip GitHub release, manifest, and R2 upload
        type: boolean
        default: true
      version:
        description: Version to stamp into the build (plain x.y.z or vx.y.z — no pre-release suffix)
        type: string
        default: "0.0.1"

permissions:
  contents: write # creating the release + uploading its assets

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # desktop:release (deps: [web:build]) only runs `bun run build` —
      # it assumes node_modules already exist, which is true for local
      # dev but not a fresh runner. `--frozen-lockfile` matches ci.yml's
      # web-build step so a release build resolves the exact versions
      # bun.lock records rather than whatever `bun install` would drift
      # to.
      - name: Install web dependencies
        shell: bash
        working-directory: web
        run: bun install --frozen-lockfile

      # Pinned to go.mod's exact wailsapp/wails/v2 version so the CLI's
      # generated build assets (wails_tools.nsh, etc.) match the library
      # the app links against. windows-latest has no wails CLI
      # preinstalled — only the Go module is a dependency, not the
      # binary.
      - name: Install wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          echo "$(cygpath -u "$(go env GOPATH)")/bin" >> "$GITHUB_PATH"

      # windows-latest bundles NSIS 3.10 (actions/runner-images
      # Windows2022-Readme.md) but it isn't reliably on PATH, so `wails
      # build -nsis` silently skips the installer with only a warning
      # (wails' shell.CommandExists("makensis") check) instead of
      # failing. Install via choco as a fallback for images that drop
      # it, then append the default install dir either way.
      - name: Ensure NSIS (makensis) is on PATH
        shell: bash
        run: |
          if ! command -v makensis >/dev/null 2>&1; then
            choco install nsis -y --no-progress
          fi
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"

      # Reuses Taskfile's desktop:release rather than duplicating the
      # wails build + ldflags + wails.json productVersion stamping in
      # YAML — one place decides how a versioned installer is built.
      # UPDATE_BASE_URL is a repo/org variable (not a secret: it's the
      # public update API root baked into the binary), so a release
      # never silently ships with updates disabled.
      - name: Build installer
        shell: bash
        env:
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
        run: |
          curl -sSL https://github.com/go-task/task/releases/latest/download/task_windows_amd64.zip -o task.zip
          unzip -o task.zip task.exe
          ./task.exe desktop:release VERSION=${{ steps.ver.outputs.version }} UPDATE_BASE_URL="${UPDATE_BASE_URL}"

      - name: Compute checksum
        shell: bash
        run: |
          cd cmd/catchm-desktop/build/bin
          # Canonical two-space format, no binary-mode "*": the MSYS/Git
          # Bash sha256sum on this runner defaults to binary mode and
          # writes "<hex> *<name>", which already-shipped strict parsers
          # (pre-v0.1.1 clients) reject.
          h=$(sha256sum catchm-desktop-amd64-installer.exe | cut -d' ' -f1)
          printf '%s  %s\n' "$h" catchm-desktop-amd64-installer.exe > catchm-desktop-amd64-installer.exe.sha256
          cat catchm-desktop-amd64-installer.exe.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            cmd/catchm-desktop/build/bin/catchm-desktop-amd64-installer.exe
            cmd/catchm-desktop/build/bin/catchm-desktop-amd64-installer.exe.sha256
          if-no-files-found: error

  macos:
    # macos-14 was retired ("configuration 'macos-14-arm64-us-xl' is not
    # supported"). Wails links with a macOS 11.0 minimum on its own, so
    # the newer runner SDK doesn't raise the app's minimum macOS.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      # Same go-version source as the windows job: go.mod is the single
      # version decider for both platforms.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # Same web build the windows job does (see its comment): the
      # release task only runs `bun run build` and assumes
      # node_modules exist on a fresh runner.
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # Same pinned CLI version as the windows job so generated build
      # assets match the library the app links against.
      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      # Homebrew's go-task formula is maintained upstream
      # (go-task/homebrew-tap) and the runner's brew is
      # GitHub-hosted — no curl|sh from arbitrary sources.
      - name: Install task
        run: brew install go-task

      # Same UPDATE_BASE_URL guard as the windows job: a repo/org
      # variable, required so a release never silently ships with
      # updates disabled.
      - name: Build dmg
        env:
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
        run: |
          task desktop:release:darwin VERSION=${{ steps.ver.outputs.version }} UPDATE_BASE_URL="${UPDATE_BASE_URL}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            cmd/catchm-desktop/build/bin/catchm-desktop-arm64.dmg
            cmd/catchm-desktop/build/bin/catchm-desktop-arm64.dmg.sha256
          if-no-files-found: error

  # Every step in this job is a real publish (public GitHub release,
  # update manifest, or R2 upload) and must never run for a dry run.
  # Gated on the same condition as before: a tag push, or an explicit
  # workflow_dispatch with dry_run=false. `needs: [windows, macos]`
  # makes the release all-or-nothing: if either platform's build
  # fails, nothing is published.
  publish:
    runs-on: ubuntu-latest
    needs: [windows, macos]
    steps:
      - uses: actions/checkout@v6

      # Unpacks each artifact into its own directory: dist/windows,
      # dist/macos.
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p files
          cp dist/windows/catchm-desktop-amd64-installer.exe \
             dist/windows/catchm-desktop-amd64-installer.exe.sha256 \
             dist/macos/catchm-desktop-arm64.dmg \
             dist/macos/catchm-desktop-arm64.dmg.sha256 \
             files/
          ls -l files

      # GITHUB_TOKEN suffices for same-repo release creation — no new
      # secret (verified against the workflow permissions model). Kept
      # as an internal record; harmless on a private repo, and its body
      # (--generate-notes) is what latest.json's manifest reuses below
      # so release notes are written in exactly one place.
      - name: Publish GitHub release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "CatchM ${GITHUB_REF_NAME}" \
            --notes "See release notes below." \
            --generate-notes \
            files/catchm-desktop-amd64-installer.exe \
            files/catchm-desktop-amd64-installer.exe.sha256 \
            files/catchm-desktop-arm64.dmg \
            files/catchm-desktop-arm64.dmg.sha256

      # Build the manifest catchm-api's /update/releases/latest will
      # serve (docs/plans/completed/m24-cloud-update-endpoint.md Part A).
      # Sizes are read straight off the built files rather than trusted
      # from the build step, so a truncated/corrupt asset can't publish
      # a manifest that lies about its own size. The two Windows
      # entries keep their exact shape and order; the two macOS assets
      # follow.
      - name: Build latest.json manifest
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/${GITHUB_REF_NAME}" > /tmp/release-meta.json

          cd files
          installer_size=$(( $(wc -c < catchm-desktop-amd64-installer.exe) ))
          sha_size=$(( $(wc -c < catchm-desktop-amd64-installer.exe.sha256) ))
          dmg_size=$(( $(wc -c < catchm-desktop-arm64.dmg) ))
          dmg_sha_size=$(( $(wc -c < catchm-desktop-arm64.dmg.sha256) ))

          jq -n \
            --arg tag_name "${GITHUB_REF_NAME}" \
            --arg name "CatchM ${GITHUB_REF_NAME}" \
            --argjson meta "$(cat /tmp/release-meta.json)" \
            --argjson installer_size "${installer_size}" \
            --argjson sha_size "${sha_size}" \
            --argjson dmg_size "${dmg_size}" \
            --argjson dmg_sha_size "${dmg_sha_size}" \
            '{
              tag_name: $tag_name,
              name: $name,
              body: $meta.body,
              published_at: $meta.published_at,
              assets: [
                {name: "catchm-desktop-amd64-installer.exe", size: $installer_size},
                {name: "catchm-desktop-amd64-installer.exe.sha256", size: $sha_size},
                {name: "catchm-desktop-arm64.dmg", size: $dmg_size},
                {name: "catchm-desktop-arm64.dmg.sha256", size: $dmg_sha_size}
              ]
            }' > latest.json
          cat latest.json

      # Order matters: latest.json LAST, so a half-uploaded release is
      # never advertised (Part A of the spec).
      #
      # Uses the S3-compatible API (aws s3 cp) instead of
      # `wrangler r2 object put`: the R2_ACCESS_KEY_ID/SECRET below come
      # from an API token scoped to only the catchm-releases bucket
      # (Object Read & Write), and Cloudflare only honours bucket-scoped
      # tokens on the S3 API — wrangler's `--remote` goes through the
      # REST API, which 403s for bucket-scoped tokens
      # (cloudflare/workers-sdk#9235). AWS CLI v2 is preinstalled on
      # ubuntu-latest (actions/runner-images Ubuntu2404-Readme.md).
      - name: Upload to catchm-api/releases (R2, S3 API)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd files
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp catchm-desktop-amd64-installer.exe \
            "s3://catchm-releases/${GITHUB_REF_NAME}/catchm-desktop-amd64-installer.exe" \
            --endpoint-url "$endpoint"
          aws s3 cp catchm-desktop-amd64-installer.exe.sha256 \
            "s3://catchm-releases/${GITHUB_REF_NAME}/catchm-desktop-amd64-installer.exe.sha256" \
            --endpoint-url "$endpoint"
          aws s3 cp catchm-desktop-arm64.dmg \
            "s3://catchm-releases/${GITHUB_REF_NAME}/catchm-desktop-arm64.dmg" \
            --endpoint-url "$endpoint"
          aws s3 cp catchm-desktop-arm64.dmg.sha256 \
            "s3://catchm-releases/${GITHUB_REF_NAME}/catchm-desktop-arm64.dmg.sha256" \
            --endpoint-url "$endpoint"
          aws s3 cp latest.json \
            "s3://catchm-releases/latest.json" \
            --endpoint-url "$endpoint" --content-type application/json
