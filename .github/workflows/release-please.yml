# Runs on every push to `master` -- which, under this repo's branching
# model, only happens when a `develop` -> `master` release promotion PR
# is merged and release-please's own release PR is merged (feature work
# lands on `develop` via PR first; `master` is release-only, see
# CONTRIBUTING.md).
#
# release-please inspects Conventional Commits (feat:/fix:/BREAKING CHANGE)
# accumulated since the last release, and either:
#   - opens/updates a "chore(master): release X.Y.Z" PR containing the
#     version bump + CHANGELOG.md, or
#   - once that release PR is itself merged, creates the vX.Y.Z git tag
#     and a GitHub Release.
#
# The tag push then triggers release.yml, which builds the NSIS
# installer, attaches it + its SHA-256 checksum to this release, and
# publishes the update manifest to catchm-api's RELEASES R2 bucket --
# that R2 manifest is what shipped clients actually read at runtime
# (M24). This workflow intentionally stops at "tag + GitHub Release +
# changelog"; every artifact step lives in release.yml.
name: release-please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
