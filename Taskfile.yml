version: "3"

tasks:
  build:
    desc: Build the catchm binary (always rebuilds the embedded web UI first)
    deps: [web:build]
    cmds:
      - go build -buildvcs=false -o bin/catchm ./cmd/catchm

  web:install:
    desc: Install web/ dependencies
    dir: web
    cmds:
      - bun install

  web:build:
    desc: Build the web UI into web/dist (embedded by `task build`)
    dir: web
    cmds:
      - bun run build

  web:dev:
    desc: Run the Vite dev server (proxies /api and /healthz to a running `task run`)
    dir: web
    cmds:
      - bun run dev

  run:
    desc: Run the daemon
    cmds:
      - go run ./cmd/catchm serve

  test:
    desc: Run Go tests
    cmds:
      - go test ./...

  lint:
    desc: Vet + gofmt check + no case-only filename collisions
    cmds:
      - go vet ./...
      - test -z "$(gofmt -l $(git ls-files '*.go'))"
      # Windows (the release runner) and macOS have case-insensitive
      # filesystems: two files differing only in case (v0.3.0 shipped
      # insights/Evidence.tsx next to insights/evidence.ts) break the
      # release build there while Linux CI stays green.
      - test -z "$(git ls-files | tr '[:upper:]' '[:lower:]' | sort | uniq -d)"

  tidy:
    desc: go mod tidy
    cmds:
      - go mod tidy

  desktop:dev:
    desc: >
      Run the desktop shell in dev mode (requires libgtk-3-dev,
      libwebkit2gtk-4.1-dev/4.0-dev, pkg-config; not part of the default
      build/test path)
    deps: [web:build]
    dir: cmd/catchm-desktop
    cmds:
      - wails dev -s -skipbindings

  desktop:build:
    desc: >
      Build the desktop shell binary (requires libgtk-3-dev,
      libwebkit2gtk-4.1-dev/4.0-dev, pkg-config; not part of the default
      build/test path)
    deps: [web:build]
    dir: cmd/catchm-desktop
    cmds:
      - wails build -s -skipbindings

  # M23/M24: release build of the desktop shell. VERSION stamps both the
  # running binary's version var (ldflags, compared against the latest
  # release manifest at runtime by internal/update) and wails.json's
  # productVersion (which the NSIS template reads for
  # VIProductVersion/file metadata) — the two must stay in sync or the
  # "newer" installer reports a version the app itself doesn't believe
  # it is. VERSION must be a plain x.y.z (optionally v-prefixed) —
  # NSIS's VIProductVersion only accepts 4 numeric parts, so
  # pre-release tags are rejected rather than silently mangled.
  # UPDATE_BASE_URL stamps the update API root (M24: the catchm-api
  # Worker's /update route, e.g. https://catchm-api.spacingmind.com/update) —
  # required so a release build never ships with updates silently off.
  desktop:release:
    desc: Build a versioned desktop release (task desktop:release VERSION=1.2.3 UPDATE_BASE_URL=https://catchm-api.spacingmind.com/update)
    deps: [web:build]
    dir: cmd/catchm-desktop
    preconditions:
      - sh: 'case "{{.VERSION}}" in v[0-9]*.[0-9]*.[0-9]*|[0-9]*.[0-9]*.[0-9]*) exit 0;; *) exit 1;; esac'
        msg: "VERSION must be x.y.z or vx.y.z (plain numbers only — NSIS's VIProductVersion rejects pre-release suffixes)"
      - sh: '[ -n "{{.UPDATE_BASE_URL}}" ]'
        msg: "UPDATE_BASE_URL must be set (the update API root, e.g. https://catchm-api.spacingmind.com/update) — a release build must not ship with updates silently disabled"
    cmds:
      - 'sed -i -E ''s/"productVersion": "[^"]*"/"productVersion": "{{.VERSION}}"/'' wails.json'
      - wails build -s -skipbindings -nsis -ldflags "-X main.version={{.VERSION}} -X main.updateBaseURL={{.UPDATE_BASE_URL}}"

  # macOS release build (the plan's "Build" section). Like the Windows
  # task above: VERSION is stamped into wails.json's productVersion so
  # the .app bundle and the binary agree, and UPDATE_BASE_URL must be
  # set so a release never ships with updates silently off. The app is
  # UNSIGNED (ad-hoc codesign only): macOS Gatekeeper will warn on
  # first launch (right-click → Open, or System Settings → Privacy &
  # Security → Open Anyway), and the mic permission is re-asked after
  # every update because the ad-hoc signature changes — both documented
  # in README. Signing with a Developer ID + notarization is future
  # work (see the plan's Out of scope).
  desktop:release:darwin:
    desc: Build a versioned macOS arm64 release (task desktop:release:darwin VERSION=1.2.3 UPDATE_BASE_URL=https://catchm-api.spacingmind.com/update)
    deps: [web:build]
    dir: cmd/catchm-desktop
    preconditions:
      - sh: 'case "{{.VERSION}}" in v[0-9]*.[0-9]*.[0-9]*|[0-9]*.[0-9]*.[0-9]*) exit 0;; *) exit 1;; esac'
        msg: "VERSION must be x.y.z or vx.y.z (plain numbers only — the .app bundle's version strings reject pre-release suffixes)"
      - sh: '[ -n "{{.UPDATE_BASE_URL}}" ]'
        msg: "UPDATE_BASE_URL must be set (the update API root, e.g. https://catchm-api.spacingmind.com/update) — a release build must not ship with updates silently disabled"
    cmds:
      # BSD sed: -i needs '' before the script (the Windows task's
      # `sed -i -E` would break on macOS).
      - 'sed -i '''' -E ''s/"productVersion": "[^"]*"/"productVersion": "{{.VERSION}}"/'' wails.json'
      - wails build -s -skipbindings -platform darwin/arm64 -ldflags "-X main.version={{.VERSION}} -X main.updateBaseURL={{.UPDATE_BASE_URL}}"
      - codesign --force --deep -s - build/bin/catchm-desktop.app
      # A plain .dmg: the .app plus an /Applications symlink for the
      # usual drag-to-install window.
      - rm -rf build/bin/dmg-stage && mkdir -p build/bin/dmg-stage
      - ln -sfn /Applications build/bin/dmg-stage/Applications
      # Shown as "CatchM" in Applications; the executable inside keeps
      # wails' outputfilename, so renaming the bundle is safe.
      - cp -R build/bin/catchm-desktop.app build/bin/dmg-stage/CatchM.app
      - hdiutil create -volname CatchM -srcfolder build/bin/dmg-stage -ov -format UDZO build/bin/catchm-desktop-arm64.dmg
      # From build/bin so the checksum line names the bare file
      # (sha256sum format, like the Windows .sha256).
      - cd build/bin && shasum -a 256 catchm-desktop-arm64.dmg > catchm-desktop-arm64.dmg.sha256
