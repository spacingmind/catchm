<!doctype html>
<!--
  Source for src/app/opengraph-image.png and twitter-image.png (1200x630).
  Regenerate: open in a 1200x630 viewport and screenshot it, e.g. with
  Playwright (page.setViewportSize({ width: 1200, height: 630 })).
  Fonts load from node_modules, so run `bun install` first.
-->
<html lang="en">
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Fraunces";
    src: url("../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-opsz-normal.woff2") format("woff2");
    font-weight: 100 900;
  }
  @font-face {
    font-family: "Geist";
    src: url("../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #fbf7ea; color: #6c3524; font-family: "Geist", system-ui, sans-serif;
    position: relative;
  }
  .glow {
    position: absolute; right: -260px; top: -280px; width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(closest-side, #ead9c6, transparent);
  }
  .brand { position: absolute; left: 80px; top: 64px; display: flex; align-items: center; gap: 16px; font-size: 32px; font-weight: 650; letter-spacing: -0.01em; }
  .brand img { width: 56px; height: 56px; }
  h1 {
    position: absolute; left: 80px; top: 196px; width: 700px;
    font-family: "Fraunces", Georgia, serif; font-weight: 560; font-size: 88px; line-height: 1.03; letter-spacing: -0.025em;
  }
  h1 span { color: #976f5f; }
  .foot { position: absolute; left: 80px; bottom: 60px; font-size: 26px; color: #6a4c3a; letter-spacing: 0.01em; }
  .mascot {
    position: absolute; right: 70px; top: 150px; width: 330px; height: 330px;
    filter: drop-shadow(0 40px 36px rgba(108, 53, 36, 0.35));
    transform: rotate(5deg);
  }
</style>
<body>
  <div class="glow"></div>
  <div class="brand"><img src="../public/logo.png" alt="" />CatchM</div>
  <h1>Catch the meeting.<br /><span>Keep the mind.</span></h1>
  <p class="foot">Summaries, action items, mind maps · Windows &amp; macOS</p>
  <img class="mascot" src="../public/logo.png" alt="" />
</body>
</html>
